<title>Pulse · Лента AI-визиток</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#0e0e0c}
body{background:#0e0e0c;font-family:'DM Sans',sans-serif;color:rgba(255,255,255,.8);min-height:100vh}
a{text-decoration:none;color:inherit}

/* === AUTH BAR (only when logged in) === */
.auth-bar{background:#0e0e0c;border-bottom:1px solid rgba(200,240,96,.08);padding:8px 16px;display:flex;align-items:center;justify-content:space-between}
.auth-bar.hidden{display:none}
.auth-user{display:flex;align-items:center;gap:8px}
.auth-av{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#1d6a4a,#2d9e75);display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;font-family:'Instrument Serif',serif}
.auth-name{font-size:11px;color:rgba(255,255,255,.5)}
.auth-name strong{color:rgba(255,255,255,.75)}
.auth-logout{font-size:10px;color:rgba(255,255,255,.25);cursor:pointer;background:none;border:none;font-family:'DM Sans',sans-serif}
.auth-logout:hover{color:rgba(255,255,255,.5)}

/* === CLUB SWITCHER (only when logged in) === */
.club-switcher{background:rgba(14,14,12,.98);border-bottom:1px solid rgba(255,255,255,.04);padding:10px 16px;display:flex;gap:6px;overflow-x:auto}
.club-switcher.hidden{display:none}
.club-switcher::-webkit-scrollbar{display:none}
.cs-tab{flex-shrink:0;display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);cursor:pointer;transition:all .15s}
.cs-tab:hover{border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.04)}
.cs-tab.active{background:rgba(200,240,96,.08);border-color:rgba(200,240,96,.2)}
.cs-tab-name{font-size:11px;color:rgba(255,255,255,.4);white-space:nowrap}
.cs-tab.active .cs-tab-name{color:#c8f060;font-weight:500}
.cs-tab-count{font-size:9px;color:rgba(255,255,255,.2);background:rgba(255,255,255,.04);border-radius:8px;padding:1px 5px}
.cs-tab.active .cs-tab-count{color:rgba(200,240,96,.6);background:rgba(200,240,96,.08)}
.cs-tab-home{font-size:7px;color:rgba(200,240,96,.4);letter-spacing:.06em}

/* === FEED HEADER === */
.fh{position:sticky;top:0;z-index:100;background:rgba(14,14,12,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.06);padding:12px 16px}
.fh-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.fh-logo{font-family:'Instrument Serif',serif;font-size:20px;color:#c8f060;font-style:italic}
.fh-login{font-size:10px;color:rgba(200,240,96,.5);background:rgba(200,240,96,.06);border:1px solid rgba(200,240,96,.12);padding:4px 12px;border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.fh-login:hover{background:rgba(200,240,96,.12);color:#c8f060}
.fh-login.hidden{display:none}
.fh-club{display:flex;align-items:center;gap:5px;margin-bottom:6px}
.fh-club-icon{width:16px;height:16px;opacity:.3}
.fh-club-txt{font-size:11px;color:rgba(255,255,255,.35)}
.fh-club-txt strong{color:rgba(255,255,255,.6);font-weight:500}
.fh-stats{display:flex;gap:12px;font-size:9px;color:rgba(255,255,255,.2)}
.fh-stats b{color:rgba(200,240,96,.45);font-weight:500}

/* === CARD (full visual identical to pulse_tg_card) === */
.fl{max-width:440px;margin:0 auto;padding:12px 12px 40px}

.card-top{padding:18px 18px 0}
.card-mention{font-size:11px;color:#5b9cf6;margin-bottom:10px;font-weight:500}
.card-mention span{opacity:.6;color:rgba(255,255,255,.45)}
.card-identity{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.id-av{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Instrument Serif',serif;font-size:18px;color:#fff;flex-shrink:0;border:2px solid transparent}
.tier-bronze .id-av{border-color:rgba(180,130,80,.4)}
.tier-silver .id-av{border-color:rgba(200,205,215,.5)}
.tier-gold .id-av{border-color:rgba(239,159,39,.45)}
.tier-vip .id-av{border-color:rgba(127,119,221,.45)}
.id-name{font-size:16px;font-weight:500;color:#fff;margin-bottom:2px}
.tier-pro .id-name{color:#FAC775}
.tier-master .id-name{color:#FAC775}
.tier-guru .id-name{color:#c4b5fd}
.id-club{display:flex;align-items:center;gap:8px;border-left:3px solid #c8f060;padding:6px 12px;margin:6px 0;background:rgba(200,240,96,.03);border-radius:0 8px 8px 0}
.id-club-icon{width:14px;height:14px;flex-shrink:0}
.id-club-pre{font-size:8px;color:rgba(255,255,255,.25);letter-spacing:.05em}
.id-club-name{font-size:12px;color:#c8f060;font-weight:600}
.id-role{font-size:11.5px;color:rgba(255,255,255,.5);line-height:1.45}
.id-role strong{color:rgba(255,255,255,.75);font-weight:500}
.id-geo{font-size:10px;color:rgba(255,255,255,.25);margin-top:2px}
.id-badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.ib{display:inline-flex;align-items:center;gap:3px;border-radius:20px;padding:2px 7px;font-size:8px}
.ib-tier{font-weight:600;font-size:9px;padding:3px 10px;letter-spacing:.03em}
.ib-tier.bronze{background:rgba(180,130,80,.1);border:1px solid rgba(180,130,80,.25);color:#B4824F}
.ib-tier.silver{background:rgba(200,205,215,.1);border:1px solid rgba(200,205,215,.3);color:#C8CDD7}
.ib-tier.gold{background:rgba(239,159,39,.12);border:1px solid rgba(239,159,39,.25);color:#BA7517}
.ib-tier.vip{background:rgba(127,119,221,.12);border:1px solid rgba(127,119,221,.25);color:#7F77DD}
.ib-prod{background:rgba(200,240,96,.05);border:1px solid rgba(200,240,96,.08);color:rgba(200,240,96,.5)}
.ib-fill{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);color:rgba(255,255,255,.3)}
.ib-score{font-size:8px;color:rgba(255,255,255,.25);position:relative;cursor:help}.ib-score:hover::after{content:"Pulse Score — рейтинг вашей визитки в сети. Чем выше — тем точнее знакомства.";position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:rgba(10,10,8,.95);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.7);font-size:10px;padding:6px 10px;border-radius:6px;white-space:nowrap;z-index:50;pointer-events:none}
/* Card tier top border */
.card-wrap{background:#17212b;border-radius:16px;overflow:hidden;margin-bottom:14px;position:relative;border:2px solid transparent}
/* Score < 100 — базовая, без рамки */
.card-wrap.tier-default{border-color:rgba(255,255,255,.06)}
/* Score ≥ 100 — серебряная */
.card-wrap.tier-silver{border-color:rgba(192,200,215,.5);box-shadow:0 8px 32px rgba(0,0,0,.3),0 0 20px rgba(192,200,215,.12)}
/* Score ≥ 300 — золотая PRO */
.card-wrap.tier-pro{border-color:rgba(239,159,39,.5);box-shadow:0 8px 32px rgba(0,0,0,.3),0 0 25px rgba(239,159,39,.12)}
/* Score ≥ 500 — золотая MASTER */
.card-wrap.tier-master{border-color:rgba(239,159,39,.6);box-shadow:0 8px 32px rgba(0,0,0,.3),0 0 30px rgba(239,159,39,.18)}
/* Score ≥ 1000 — чёрная с переливом GURU */
.card-wrap.tier-guru{border:2px solid transparent;background-clip:padding-box;position:relative}
.card-wrap.tier-guru::before{content:'';position:absolute;inset:-2px;border-radius:17px;background:linear-gradient(135deg,#1a1a2e,#6b21a8,#0f172a,#7c3aed,#1a1a2e);background-size:300% 300%;animation:guruBorder 4s ease infinite;z-index:-1}
@keyframes guruBorder{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
/* Tier badge — правый верхний угол */
.tier-badge{position:absolute;top:10px;right:12px;font-size:8px;font-weight:700;letter-spacing:.1em;padding:3px 8px;border-radius:20px;text-transform:uppercase}
.tier-badge-pro{background:rgba(239,159,39,.15);border:1px solid rgba(239,159,39,.35);color:#EF9F27}
.tier-badge-master{background:rgba(239,159,39,.2);border:1px solid rgba(239,159,39,.5);color:#FAC775;box-shadow:0 0 10px rgba(239,159,39,.2)}
.tier-badge-guru{background:linear-gradient(135deg,rgba(124,58,237,.3),rgba(109,33,168,.3));border:1px solid rgba(124,58,237,.5);color:#c4b5fd;box-shadow:0 0 14px rgba(124,58,237,.25)}
.bio{font-size:12.5px;color:rgba(255,255,255,.55);line-height:1.6;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bio strong{color:rgba(255,255,255,.85);font-weight:500}
.bio em{font-style:normal;color:#c8f060}
.radar-row{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.radar-stats{flex:1;display:flex;flex-direction:column;gap:6px}
.st{display:flex;align-items:center;gap:7px;opacity:0;transform:translateX(-12px);transition:all .5s ease}
.st.vis{opacity:1;transform:translateX(0)}
.st-l{font-size:10px;color:rgba(255,255,255,.45);width:130px;flex-shrink:0;line-height:1.25}
.st-bar{flex:1;height:3.5px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden;min-width:40px}
.st-fill{height:100%;border-radius:2px;width:0;transition:width 1s cubic-bezier(.22,.61,.36,1)}
.st-v{font-size:10px;min-width:16px;text-align:right;font-weight:500}
.aim-sep{height:1px;background:linear-gradient(90deg,transparent,rgba(200,240,96,.15),transparent);margin-bottom:10px}
.aim-head{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.aim-icon{width:22px;height:22px;border-radius:5px;background:linear-gradient(135deg,rgba(200,240,96,.12),rgba(200,240,96,.03));border:1px solid rgba(200,240,96,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.aim-head-txt{font-size:12px;color:#fff;font-weight:500}
.aim-head-count{font-size:9.5px;color:rgba(200,240,96,.5);margin-top:1px}
.aim-card{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:8px;padding:8px 10px;margin-bottom:4px;position:relative;overflow:hidden}
.aim-card-top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.aim-av{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;flex-shrink:0;font-family:'Instrument Serif',serif}
.aim-who{font-size:10.5px;color:rgba(255,255,255,.6);font-weight:500;flex:1;line-height:1.25}
.aim-score{font-size:8px;color:#c8f060;font-weight:600;background:rgba(200,240,96,.07);border:1px solid rgba(200,240,96,.08);border-radius:4px;padding:2px 5px;flex-shrink:0}
.aim-why{display:flex;gap:4px;align-items:flex-start}
.aim-bolt{width:10px;height:10px;flex-shrink:0;margin-top:1px}
.aim-why-txt{font-size:9.5px;color:rgba(200,240,96,.65);line-height:1.35}
.aim-card.locked .aim-who,.aim-card.locked .aim-why-txt{filter:blur(4px);user-select:none}
.aim-lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(23,33,43,.2);opacity:0;transition:opacity .2s;cursor:pointer;border-radius:8px;z-index:2}
.aim-card.locked:hover .aim-lock{opacity:1}
.aim-lock-pill{background:rgba(23,33,43,.9);border:1px solid rgba(255,255,255,.1);border-radius:5px;padding:3px 9px;display:flex;align-items:center;gap:3px;font-size:8px;color:rgba(255,255,255,.65)}
.aim-more{text-align:center;font-size:9px;color:rgba(255,255,255,.18);padding:2px 0 8px}
.card-cta{border-top:1px solid rgba(255,255,255,.05);padding:10px 18px 14px}
/* Social proof section */
.card-social{border-top:1px solid rgba(255,255,255,.04);padding:12px 18px}
.cs-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.cs-meet{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border-radius:9px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.02);cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif}
.cs-meet:hover{border-color:rgba(200,240,96,.2);background:rgba(200,240,96,.04)}
.cs-meet.clicked{border-color:rgba(200,240,96,.25);background:rgba(200,240,96,.06)}
.cs-meet-icon{font-size:14px}
.cs-meet-txt{font-size:11px;color:rgba(255,255,255,.5);font-weight:500}
.cs-meet.clicked .cs-meet-txt{color:#c8f060}
.cs-meet-count{font-size:10px;color:rgba(255,255,255,.2);background:rgba(255,255,255,.04);padding:2px 7px;border-radius:8px;margin-left:auto}
.cs-meet.clicked .cs-meet-count{color:rgba(200,240,96,.5);background:rgba(200,240,96,.06)}
.cs-thanks-btn{display:flex;align-items:center;justify-content:center;gap:5px;padding:9px 14px;border-radius:9px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;flex-shrink:0}
.cs-thanks-btn:hover{border-color:rgba(255,180,80,.2);background:rgba(255,180,80,.04)}
.cs-thanks-btn span{font-size:11px;color:rgba(255,255,255,.35)}
/* Thanks display */
.cs-thanks-list{margin-top:4px}
.cs-thank{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);border-radius:8px;padding:8px 10px;margin-bottom:4px;position:relative}
.cs-thank-text{font-size:11px;color:rgba(255,255,255,.45);line-height:1.5;font-style:italic}
.cs-thank-from{font-size:9px;color:rgba(255,255,255,.2);margin-top:4px}
.cs-thank-count{font-size:9px;color:rgba(255,255,255,.15);text-align:center;margin-top:4px}
/* Thanks modal */
.thanks-modal{display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.7);align-items:center;justify-content:center;padding:20px}
.thanks-modal.open{display:flex}
.thanks-box{background:#1c1e1d;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;max-width:360px;width:100%}
.thanks-box h3{font-size:14px;color:#fff;font-weight:500;margin-bottom:6px}
.thanks-box p{font-size:11px;color:rgba(255,255,255,.35);line-height:1.55;margin-bottom:12px}
.thanks-box .warn-note{font-size:10px;color:rgba(255,180,0,.4);margin-bottom:12px;line-height:1.5}
.thanks-box textarea{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 12px;color:#fff;font-size:12px;font-family:'DM Sans',sans-serif;resize:none;outline:none;height:80px;line-height:1.5}
.thanks-box textarea:focus{border-color:rgba(200,240,96,.2)}
.thanks-box textarea::placeholder{color:rgba(255,255,255,.15)}
.thanks-btns{display:flex;gap:8px;margin-top:12px}
.thanks-send{flex:1;padding:10px;border-radius:9px;background:#c8f060;color:#0a0a08;font-size:12px;font-weight:600;border:none;cursor:pointer;font-family:'DM Sans',sans-serif}
.thanks-cancel{padding:10px 16px;border-radius:9px;background:none;border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.4);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif}
/* Login required overlay */
.login-required{display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.7);align-items:center;justify-content:center;padding:20px}
.login-required.open{display:flex}
.lr-box{background:#1c1e1d;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:24px;max-width:320px;width:100%;text-align:center}
.lr-box h3{font-size:14px;color:#fff;margin-bottom:8px}
.lr-box p{font-size:12px;color:rgba(255,255,255,.35);margin-bottom:16px;line-height:1.55}
.lr-box a{display:inline-block;padding:10px 24px;background:#c8f060;color:#0a0a08;border-radius:9px;font-size:12px;font-weight:600}
.lr-box .lr-close{display:block;margin-top:12px;font-size:11px;color:rgba(255,255,255,.25);cursor:pointer;background:none;border:none;font-family:'DM Sans',sans-serif}
.cta-row{display:flex;gap:6px;margin-bottom:6px}
.cta-p{flex:2;display:flex;align-items:center;justify-content:center;gap:5px;background:#c8f060;color:#0a0a08;font-size:11px;font-weight:600;padding:9px;border-radius:9px;cursor:pointer;font-family:'DM Sans',sans-serif;border:none}
.cta-s{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.5);font-size:10.5px;font-weight:500;padding:9px;border-radius:9px;cursor:pointer;font-family:'DM Sans',sans-serif;border:none}
.cta-hint{font-size:8px;color:rgba(255,255,255,.12);text-align:center}

.fl{max-width:440px;margin:0 auto;padding:12px 12px 40px}

let thanksTarget='';let thanksName='';
const thanksPhrases=[
  'Помог разобраться с выходом на новый рынок за одну встречу',
  'Познакомил с нужным инвестором — сделка закрылась',
  'Дал совет который сэкономил полгода работы',
  'Очень полезный контакт, рекомендую',
  'Подсказал решение проблемы, которую не мог решить месяц',
  'Открытый и щедрый человек, делится контактами',
  'Благодаря знакомству вышли на крупного клиента',
  'Всегда на связи, отвечает быстро и по делу'
];
function randomThank(){return thanksPhrases[Math.floor(Math.random()*thanksPhrases.length)];}

function toggleMeet(pid){
  if(!loggedIn){document.getElementById('loginReq').classList.add('open');return;}
  const el=document.getElementById('meet-'+pid);
  const cnt=document.getElementById('meet-c-'+pid);
  const isClicked=el.classList.contains('clicked');
  el.classList.toggle('clicked');
  const n=parseInt(cnt.textContent);
  cnt.textContent=isClicked?n-1:n+1;
}
function openThanks(pid,name){
  if(!loggedIn){document.getElementById('loginReq').classList.add('open');return;}
  thanksTarget=pid;thanksName=name;
  document.getElementById('thanksModal').classList.add('open');
  document.getElementById('thanksText').value='';
  document.getElementById('thanksText').focus();
}
function closeThanks(){document.getElementById('thanksModal').classList.remove('open');}
function sendThanks(){
  const text=document.getElementById('thanksText').value.trim();
  if(!text)return;
  closeThanks();

// PULSE MATCHING ENGINE — ТЗ pulse_matching_spec.md
// Thinking Layer 50% — комплементарность стилей
// Context Layer  50% — A.resources → B.needs (Value Match)
// ═══════════════════════════════════════════════════════════════

function getThinkingProfile(p){
  var all=((p.statement||'')+(p.role||'')+(p.request||'')+(p.axesList||[]).map(function(a){return a.n||'';}).join(' ')).toLowerCase();
  return {
    speed:      /быстр|серийн|запуск|экзит|масштаб/.test(all)?'fast':/анализ|исследован|методолог|систем|аудит/.test(all)?'slow':'medium',
    scope:      /экосистем|платформ|глобальн|стратег|международн/.test(all)?'global':/детал|процесс|операц|внедрен/.test(all)?'detailed':'mixed',
    energy:     /серийн|основат|фаундер|построил|масштаб|несколько/.test(all)?'high':'medium',
    risk:       /инвест|венчур|angel|крипто|web3|токен|стартап/.test(all)?'aggressive':/управл|систем|операц|безопасн/.test(all)?'cautious':'balanced',
    initiative: /основат|фаундер|создал|запустил|строит/.test(all)?'proactive':'reactive',
    comm:       /публич|медиа|спикер|книг|контент|курс/.test(all)?'flexible':/структур|систем|методолог/.test(all)?'structured':'flexible'
  };
}

function thinkingScore(a,b){
  var ta=getThinkingProfile(a), tb=getThinkingProfile(b);
  var s=50;
  // Скорость: быстрый + медленный = хорошая пара
  if((ta.speed==='fast'&&tb.speed==='slow')||(ta.speed==='slow'&&tb.speed==='fast'))s+=20;
  else if(ta.speed==='medium'||tb.speed==='medium')s+=10;
  else s+=5;
  // Масштаб: глобальный + детальный = сильная пара
  if((ta.scope==='global'&&tb.scope==='detailed')||(ta.scope==='detailed'&&tb.scope==='global'))s+=20;
  else if(ta.scope==='mixed')s+=10;
  else s+=5;
  // Риск: агрессивный + взвешенный хорошо
  if((ta.risk==='aggressive'&&tb.risk==='balanced')||(ta.risk==='balanced'&&tb.risk==='aggressive'))s+=10;
  else if(ta.risk===tb.risk)s+=5;
  return Math.min(100,s);
}

function contextScore(a,b){
  var aRes=(a.axesList||[]).map(function(ax){return(ax.n||ax.d||'').toLowerCase();}).join(' ');
  var bNeed=((b.request||'')+(b.statement||'')).toLowerCase();
  var bRes=(b.axesList||[]).map(function(ax){return(ax.n||ax.d||'').toLowerCase();}).join(' ');
  var aNeed=((a.request||'')+(a.statement||'')).toLowerCase();
  var DOMAINS=[
    ['инвест','фонд','angel','венчур','капитал','раунд'],
    ['нетворк','клуб','сообщ','контакт','знакомств','связи'],
    ['ai','нейронк','автоматиз','machine','llm','алгоритм'],
    ['web3','крипто','блокчейн','токен','nft'],
    ['масштаб','рост','экспансия','b2b','продаж'],
    ['систем','операц','процесс','управл'],
    ['маркетинг','бренд','контент','публичн','медиа'],
    ['недвижим','девелопмент','строительств'],
    ['экзит','m&a','сделк'],
    ['ментор','консалт','обучен','коучинг'],
    ['it','продукт','разработк','стартап','mvp'],
    ['личный бренд','pr','репутац','имидж']
  ];
  function match(res,need){
    var s=0;
    DOMAINS.forEach(function(d){
      var inR=d.some(function(k){return res.indexOf(k)>=0;});
      var inN=d.some(function(k){return need.indexOf(k)>=0;});
      if(inR&&inN)s+=20;
    });
    return Math.min(100,s);
  }
  return Math.round(match(aRes,bNeed)*0.5+match(bRes,aNeed)*0.5);
}

function calcMatchScore(a,b){
  if(!a||!b)return{score:0,decision:'IGNORE',why:'',label:''};
  var bFull=((b.role||'')+(b.statement||'')+(b.request||'')+
    (b.axesList||[]).map(function(ax){return(ax.n||'')+(ax.d||'');}).join(' ')).toLowerCase();
  var aFull=((a.role||'')+(a.statement||'')+
    (a.axesList||[]).map(function(ax){return ax.n||'';}).join(' ')).toLowerCase();
  // VM needs — что VM ищет у других
  var vmNeeds=['девелоп','недвиж','оаэ','дубай','абу-даби','испани','марбел',
               'азия','индия','юго-восточ','падел','co-founder','венчур'];
  // VM resources — что VM может дать
  var vmRes=['нетворк','союзник','экзит','инвестиц','web3','токен','ai','нейро','систем','масштаб'];
  // 1. B закрывает потребность VM (35%)
  var needHits=0;
  vmNeeds.forEach(function(w){if(bFull.indexOf(w)>=0)needHits+=13;});
  var needScore=Math.min(100,needHits);
  // 2. VM нужен B (25%)
  var bReq=((b.request||'')+(b.statement||'')).toLowerCase();
  var giveHits=0;
  vmRes.forEach(function(w){if(bReq.indexOf(w)>=0)giveHits+=16;});
  var giveScore=Math.min(100,giveHits);
  // 3. Домены пересечения (25%)
  var DOMAINS=[
    {kws:['инвест','фонд','angel','венчур'],label:'инвестиции'},
    {kws:['нетворк','клуб','сообщ'],label:'нетворкинг'},
    {kws:['ai','нейрон','автоматиз'],label:'AI'},
    {kws:['web3','крипто','токен'],label:'Web3'},
    {kws:['масштаб','рост','экспанс'],label:'масштабирование'},
    {kws:['операц','систем','процесс'],label:'операционка'},
    {kws:['недвижим','девелоп'],label:'недвижимость'},
    {kws:['маркетинг','бренд'],label:'маркетинг'},
    {kws:['экзит','m&a','продал'],label:'экзит'},
    {kws:['стартап','продукт','it'],label:'продукты'},
  ];
  var shared=[],domHits=0;
  DOMAINS.forEach(function(d){
    var inA=d.kws.some(function(k){return aFull.indexOf(k)>=0;});
    var inB=d.kws.some(function(k){return bFull.indexOf(k)>=0;});
    if(inA&&inB){shared.push(d.label);domHits+=14;}
  });
  var domScore=Math.min(100,domHits);
  // 4. Гео-бонус (до +15)
  var geoBonus=0;
  ['бали','дубай','оаэ','москва','испани','сша','азия'].forEach(function(g){if(bFull.indexOf(g)>=0)geoBonus+=5;});
  geoBonus=Math.min(15,geoBonus);
  // 5. PCS (до +8)
  var pcsBonus=Math.min(8,Math.round((calcPCS(b)/1000)*8));
  // Итог без фиксированной базы
  var raw=needScore*0.35+giveScore*0.25+domScore*0.25+geoBonus+pcsBonus;
  var score=Math.min(97,Math.max(18,Math.round(raw)));
  var decision=score>=65?'INTRODUCE':score>=40?'WAIT':'WEAK';
  var why=shared.length?'Пересечение: '+shared.slice(0,2).join(' · ')
    :needScore>18?'Есть то, что тебе нужно'
    :giveScore>18?'Нужен твой опыт и нетворк'
    :'Взаимодополняющие роли';
  var label=score>=85?'★ сильный матч':score>=70?'хороший матч':score>=52?'матч':'слабый';
  return{score:score,decision:decision,why:why,label:label};
}

    feed.innerHTML='<div class="sync-empty"><div class="sync-empty-icon">\u26a1</div>'
      +'<div class="sync-empty-title">\u041f\u043e\u043a\u0430 \u043f\u0443\u0441\u0442\u043e</div>'
      +'<div class="sync-empty-sub">\u041d\u0430\u0436\u043c\u0438 \u00ab\u0425\u043e\u0447\u0443 \u043f\u043e\u0437\u043d\u0430\u043a\u043e\u043c\u0438\u0442\u044c\u0441\u044f\u00bb \u043d\u0430 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0443.</div></div>';
    return;
  }
  updateSyncBadge();
  var hdr=document.createElement('div');
  hdr.style.cssText='padding:6px 16px 10px;font-size:9px;color:rgba(96,165,250,.6);letter-spacing:.08em;text-transform:uppercase;font-weight:600';
  hdr.textContent='\u26a1 '+showPids.length+' \u0432\u0437\u0430\u0438\u043c\u043d\u044b\u0445 \u0441\u043e\u0432\u043f\u0430\u0434\u0435\u043d\u0438\u044f';
  feed.appendChild(hdr);

  var intros={
    'et':{why:'\u0415\u043b\u0435\u043d\u0430 \u0441\u0442\u0440\u043e\u0438\u0442 InvestStream \u2014 500+ \u0438\u043d\u0432\u0435\u0441\u0442\u043e\u0440\u043e\u0432 \u0432 \u041e\u0410\u042d. \u041f\u0440\u044f\u043c\u043e\u0435 \u043f\u043e\u043f\u0430\u0434\u0430\u043d\u0438\u0435 \u0432 \u0437\u0430\u043f\u0440\u043e\u0441.',give:'\u0414\u0430\u0451\u0442: \u0434\u043e\u0441\u0442\u0443\u043f \u043a \u0434\u0435\u0432\u0435\u043b\u043e\u043f\u0435\u0440\u0430\u043c \u041e\u0410\u042d \xb7 Senior AM \u0432 GBM',open:'\u0421\u043f\u0440\u043e\u0441\u0438 \u043f\u0440\u043e \u043a\u043e\u043d\u0442\u0430\u043a\u0442\u044b \u0434\u0435\u0432\u0435\u043b\u043e\u043f\u0435\u0440\u043e\u0432 \u0432 \u0410\u0431\u0443-\u0414\u0430\u0431\u0438.'},
    'ak':{why:'\u0410\u043d\u043d\u0430 \u0441\u0438\u0441\u0442\u0435\u043c\u0430\u0442\u0438\u0437\u0438\u0440\u043e\u0432\u0430\u043b\u0430 35+ \u0431\u0438\u0437\u043d\u0435\u0441\u043e\u0432, \u043c\u0430\u0441\u0448\u0442\u0430\u0431\u0438\u0440\u043e\u0432\u0430\u043b\u0430 Joy \u0432 5 \u0441\u0442\u0440\u0430\u043d\u0430\u0445.',give:'\u0414\u0430\u0451\u0442: COO-\u044d\u043a\u0441\u043f\u0435\u0440\u0442\u0438\u0437\u0430 \xb7 \u043e\u043f\u044b\u0442 \u044d\u043a\u0437\u0438\u0442\u0430 \u0441\u0435\u0442\u0438',open:'\u0421\u043f\u0440\u043e\u0441\u0438 \u043f\u0440\u043e \u043e\u043f\u0435\u0440\u0430\u0446\u0438\u043e\u043d\u043a\u0443 \u043f\u0440\u0438 \u0432\u044b\u0445\u043e\u0434\u0435 \u0432 \u043d\u043e\u0432\u044b\u0435 \u0441\u0442\u0440\u0430\u043d\u044b.'},
    'dz':{why:'\u0414\u0430\u0440\u044c\u044f \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0437\u0438\u0440\u0443\u0435\u0442 \u043e\u043f\u0435\u0440\u0430\u0446\u0438\u043e\u043d\u043a\u0443 \u0447\u0435\u0440\u0435\u0437 AI \u2014 \u0438\u043c\u0435\u043d\u043d\u043e \u0442\u043e, \u0447\u0442\u043e \u043d\u0443\u0436\u043d\u043e Pulse \u0438 LAL.',give:'\u0414\u0430\u0451\u0442: AI-\u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0437\u0430\u0446\u0438\u044f \xb7 \u0440\u0430\u0431\u043e\u0442\u0430\u0435\u0442 \u043d\u0430 \u0411\u0430\u043b\u0438',open:'\u0423\u043f\u043e\u043c\u044f\u043d\u0438 \u0447\u0442\u043e \u0441\u0442\u0440\u043e\u0438\u0448\u044c AI-\u0430\u0433\u0435\u043d\u0442\u043e\u0432 \u0434\u043b\u044f LAL.'}
  };

  showPids.forEach(function(pid,idx){
    var p=getSyncParticipant(pid); if(!p)return;
    var intro=intros[pid]||null;
    var score=(p._match&&p._match.score)?p._match.score:(40+Math.abs(pid.charCodeAt(0)*17)%45);
    var isNew=vmDemoLikes.indexOf(pid)>=0;
    var isPinned=pinnedPids.indexOf(pid)>=0;

    // Полная карточка через buildCard
    var card=buildCard(p,idx);
    card.id='sync-card-'+pid;
    if(isPinned){card.style.borderColor='rgba(239,185,39,.4)';card.style.boxShadow='0 0 16px rgba(239,185,39,.08)';}
    else{card.style.borderColor=isNew?'rgba(96,165,250,.4)':'rgba(96,165,250,.15)';}
    if(isNew) card.style.boxShadow='0 0 20px rgba(96,165,250,.08)';

    // Прячем ненужные блоки
    var paidBlk=card.querySelector('.paid-tier'); if(paidBlk)paidBlk.style.display='none';
    var socialRow=card.querySelector('.card-social'); if(socialRow)socialRow.style.display='none';

    // Восстанавливаем AI Sync если уже был запущен
    if(syncResults[pid]){
      var sp=card.querySelector('#sync-'+pid),sb=card.querySelector('#syncbtn-'+pid);
      if(sp){sp.style.display='block';sp.innerHTML=syncResults[pid].html;}
      if(sb){sb.disabled=syncResults[pid].disabled;sb.style.opacity=syncResults[pid].disabled?'0.4':'1';sb.innerHTML=syncResults[pid].btnHtml;}
    }

    // Tier badge — делаем инлайн копию
    var tierEl=card.querySelector('.tier-badge');
    var tierHTML='';
    if(tierEl){
      tierHTML='<span class="'+tierEl.className+'" style="position:relative;top:auto;right:auto;display:inline-flex">'+tierEl.textContent+'</span>';
      tierEl.style.display='none';
    }

    // SYNC шапка
    var syncHdr=document.createElement('div');
    syncHdr.className='sync-card-header';
    syncHdr.innerHTML=(isNew?'<span class="sync-new-label">\u26a1 \u0412\u0437\u0430\u0438\u043c\u043d\u043e</span>':'<span style="font-size:10px;color:rgba(255,255,255,.2)">\u2714</span>')
      +'<div style="display:flex;align-items:center;gap:8px">'
      +tierHTML
      +'<span class="sync-match-pct">'+score+'%</span>'
      +'<span class="sync-star'+(isPinned?' active':'')+'" id="star-'+pid+'">&#9733;</span>'
      +'</div>';
    card.insertBefore(syncHdr,card.firstChild);

    // Обработчик звёздочки
    var starEl=syncHdr.querySelector('.sync-star');
    if(starEl)(function(p2){starEl.onclick=function(e){e.stopPropagation();toggleSyncPin(p2);};})(pid);

    // AI-интро (только персонализированный)
    if(intro){
      var introEl=document.createElement('div');
      introEl.className='sync-intro';
      introEl.innerHTML='<div class="sync-intro-label">\u26a1 AI-\u0438\u043d\u0442\u0440\u043e</div>'
        +'<div class="sync-intro-why">'+intro.why+'</div>'
        +'<div class="sync-intro-give">\u2192 '+intro.give+'</div>'
        +'<div class="sync-intro-open">\u201c'+intro.open+'\u201d</div>';
      var ct=card.querySelector('.card-top');
      if(ct)ct.after(introEl); else card.appendChild(introEl);
    }

    // Кнопки: Telegram + Благодарность
    var ctaEl=card.querySelector('.card-cta');
    if(ctaEl){
      ctaEl.innerHTML='<div style="display:flex;gap:8px;padding:0 0 6px">'
        +'<button class="sync-btn-tg" onclick="window.open(\'https://t.me/'+(p.handle||pid)+'\',\'_blank\')">'
        +'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4 20-7z"/></svg>'
        +' \u041d\u0430\u043f\u0438\u0441\u0430\u0442\u044c \u0432 Telegram</button>'
        +'<button class="sync-btn-thanks" onclick="openThanks(\''+pid+'\',\''+p.name+'\')">'
        +'\ud83e\udd1d \u0411\u043b\u0430\u0433\u043e\u0434\u0430\u0440\u043d\u043e\u0441\u0442\u044c</button>'
        +'</div>';
    }

    feed.appendChild(card);
  });
}

function toggleSyncPin(pid){
  var feed=document.getElementById('feed');
  var card=document.getElementById('sync-card-'+pid);
  var star=document.getElementById('star-'+pid);
  if(!card||!feed)return;
  var already=pinnedPids.indexOf(pid)>=0;
  if(already){
    pinnedPids.splice(pinnedPids.indexOf(pid),1);
    if(star)star.classList.remove('active');
    renderSyncFeed();
    return;
  }
  if(pinnedPids.length>=10){alert('\u041c\u0430\u043a\u0441\u0438\u043c\u0443\u043c 10 \u0437\u0430\u043a\u0440\u0435\u043f\u043b\u0451\u043d\u043d\u044b\u0445');return;}
  pinnedPids.unshift(pid);
  if(star){star.classList.add('active');star.style.color='#EFB927';}
  renderSyncFeed();
}


// ── Hash routing — открыть карточку по ссылке /#pid ──────────
function handleHashRoute() {
  var hash = window.location.hash.replace('#', '').trim();
  if (!hash) return;

  setTimeout(function() {
    // Найти клуб участника и переключиться на него
    var foundClub = 0;
    if (typeof clubs !== 'undefined') {
      clubs.forEach(function(club, idx) {
        (club.members || []).forEach(function(p) {
          if (p.id === hash) foundClub = idx;
        });
      });
    }
    switchClub(foundClub);

    // Прокрутить к карточке в ленте (без открытия старого оверлея)
    setTimeout(function() {
      // Ищем карточку по data-pid или по тексту handle
      var cards = document.querySelectorAll('.card-wrap');
      var target = null;
      cards.forEach(function(card) {
        var link = card.querySelector('a[href*="' + hash + '"]');
        if (link) target = card;
      });
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        // Лёгкая подсветка
        target.style.transition = 'box-shadow .4s';
        target.style.boxShadow = '0 0 0 2px rgba(200,240,96,.5)';
        setTimeout(function() { target.style.boxShadow = ''; }, 2000);
      }
    }, 500);
  }, 600);
}

// Запускаем после рендера
window.addEventListener('load', function() {
  setTimeout(handleHashRoute, 800);
});
// Реагируем на изменение хеша (если пользователь меняет URL)
window.addEventListener('hashchange', handleHashRoute);

</script>
